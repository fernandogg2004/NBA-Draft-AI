name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint · types · tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install (all extras)
        # Full extras so every test runs (models, explain, app, mlops, ingest) + dev tooling.
        # No test makes a network call, so the suite is CI-safe.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,models,explain,app,mlops,ingest]"

      - name: Ruff (lint)
        run: ruff check src tests scripts api dashboard

      - name: Mypy (strict types)
        run: mypy

      - name: Pytest
        run: pytest
