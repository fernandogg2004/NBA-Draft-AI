name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint · types · tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install (test extra)
        # The [test] extra is the exact set the offline suite needs (dev tooling + the optional
        # libs that tests import). No test makes a network call, so the suite is CI-safe.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Ruff (lint)
        run: ruff check src tests scripts api dashboard

      - name: Mypy (strict types)
        run: mypy

      - name: Pytest (with coverage gate)
        run: pytest --cov=src/nba_draft --cov-report=term-missing --cov-fail-under=85
