[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nba-draft-ai"
version = "0.0.1"
description = "Decision-support system for NBA draft decisions (human-in-the-loop)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "NBA Draft AI" }]

# Core deps kept deliberately light so Milestone 0 installs fast and runs on CPU.
# Heavy / phase-specific deps live in optional groups below and are pulled in per phase.
dependencies = [
    "polars>=1.0",
    "numpy>=1.26",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
# Phase 1 ingestion (network; run locally)
ingest = ["requests>=2.31", "nba_api>=1.4", "euroleague-api>=0.0.13"]
# Phase 3 EDA plotting
eda = ["matplotlib>=3.8"]
# Phase 6 modeling families
models = ["xgboost>=2.0", "lightgbm>=4.0", "lifelines>=0.28", "optuna>=3.5"]
# Phase 9/10 uncertainty + interpretability
explain = ["shap>=0.44"]
# Phase 11 serving (pyarrow backs polars.to_pandas() used by the Streamlit dashboard)
app = ["fastapi>=0.110", "uvicorn>=0.29", "streamlit>=1.33", "plotly>=5.20", "pyarrow>=14.0"]
# Phase 12 MLOps
mlops = ["mlflow>=2.12", "dvc>=3.50"]
# Dev tooling (httpx powers FastAPI's TestClient)
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4", "mypy>=1.9", "httpx>=0.27"]
# Everything needed to run the full offline test suite (CI installs this).
test = [
    "pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4", "mypy>=1.9", "httpx>=0.27",
    "xgboost>=2.0", "lightgbm>=4.0", "lifelines>=0.28", "optuna>=3.5",
    "shap>=0.44", "fastapi>=0.110",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nba_draft"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src", "."]
filterwarnings = [
    # third-party deprecation noise (shap/matplotlib colormaps) — not our code
    "ignore::PendingDeprecationWarning",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
# Stubs of some deps (e.g. numpy) use 3.12+ syntax; the package still supports >=3.11.
python_version = "3.12"
packages = ["nba_draft"]
mypy_path = "src"
strict = true
ignore_missing_imports = true
